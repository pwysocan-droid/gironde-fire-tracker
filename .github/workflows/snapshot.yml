name: history snapshot backstop

# The page takes its own snapshots while anyone is watching (/api/history).
# This cron only covers unwatched stretches — 30 min keeps a private repo
# comfortably inside the free Actions allowance, and the endpoint's
# min-interval guard dedupes against the opportunistic path.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/snapshot
        run: |
          curl -sS -m 120 -X POST \
            -H "Authorization: Bearer ${{ secrets.SNAPSHOT_SECRET }}" \
            -w "\nHTTP %{http_code}\n" \
            https://gironde-fire-tracker.vercel.app/api/snapshot
